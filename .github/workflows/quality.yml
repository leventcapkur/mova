name: Mova kalite kontrolü

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Derle ve denetle
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Paketleri yükle
        run: npm ci

      - name: Kod kalitesini kontrol et
        run: npm run lint

      - name: Uygulamayı derle
        run: npm run build
